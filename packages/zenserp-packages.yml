description: >-
  Zenserp publishes one first-party client library: a Python client on PyPI,
  developed in the zenserp GitHub account. There is no first-party JavaScript,
  Ruby, Go, PHP, Java, .NET or Rust SDK. The Python client's last release
  predates the v2 API surface documented today, and the repository has not been
  pushed to since 2021 -- consumers integrating in 2026 are effectively writing
  raw HTTP against the documented endpoints, which is also what every code
  snippet in the Zenserp documentation shows (curl / requests / fetch, not an SDK).
