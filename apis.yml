- aid: zenserp:zenserp-shopping-api
  name: Zenserp Shopping Product Page API
  description: >-
    Google Shopping product page endpoint, resolving a single product variant by product_id or a full
    product cluster across all merchants by gpc_id. Product ids are obtained from a shopping search. Served
    from the v1 base, not v2.
