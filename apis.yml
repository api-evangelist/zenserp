- aid: zenserp:zenserp-search-api
  name: Zenserp Search API
  description: >-
    Core search endpoint. One GET operation returns Google web, image, video, news, shopping and maps
    results (selected with tbm) plus Bing, Yandex, DuckDuckGo and YouTube results (selected with search_engine),
    with geolocation targeting across 200+ countries. Includes the account quota endpoint.
  humanURL: https://zenserp.com/
  baseURL: https://app.zenserp.com/api/v2
