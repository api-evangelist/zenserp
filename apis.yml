apis:
- aid: zenserp:zenserp-batch-api
  name: Zenserp Batch API
  description: >-
    Asynchronous batch endpoint for very large SERP datasets. Jobs are submitted together and results
    are POSTed back to a caller-supplied webhook_url, or polled by batch id. Available on the Medium plan
    and above. Served from the v1 base, not v2.
  humanURL: https://zenserp.com/
  baseURL: https://app.zenserp.com/api/v1
