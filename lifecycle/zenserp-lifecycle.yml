  url: https://zenserp.com/pricing-plans/
  uptime_target: 99.9%
  availability: Medium plan and above
  note: >-
    "Service Level Agreement" is listed as a plan feature on the Medium, Large,
    Premium and Enterprise tiers. It is not offered on Free or Small, and the SLA
    document itself is not published -- only the line item on the pricing table.

