  coupling documented at https://app.zenserp.com/documentation
name: Zenserp Data Model
description: >-
  Zenserp's object model is a projection, not a database. There are no persistent
  resources with identifiers, no CRUD, and no entity a client can fetch by id --
  with one exception, Batch. Everything else is a shape carved out of one SERP
  response, selected by the `tbm` and `search_engine` request parameters. The
  useful relationships in this API are therefore mostly PARAMETER relationships:
  the list endpoints publish the enumerations that the search parameters must draw
  from.
entity_count: 22
identified_entities: 2

entities:
  - name: SearchResponse
    root: true
    identifier: null
    description: >-
      The single top-level response of GET /api/v2/search. Which of its result
      arrays is populated depends on `tbm`; the others are absent.
    operations: [search]
    fields_of_note: [request_info, query, number_of_results]

  - name: RequestInfo
    identifier: null
    description: Per-request metadata -- success flag, credits used, credits remaining.
    embedded_in: [SearchResponse, BatchResponse]

  - name: QueryInfo
    identifier: null
    description: Echo of the effective query parameters (q, gl, hl, num, engine, tbm, location).
    embedded_in: [SearchResponse]

  - name: OrganicResult
    identifier: null
    description: A non-paid SERP result. Carries sitelinks as an inline sub-array.
    populated_when: default (no tbm)

  - name: PaidResult
    identifier: null
    description: An advertisement result. The object an ad-verification workflow reads.
    populated_when: default (no tbm)

  - name: FeaturedSnippet
    identifier: null
    populated_when: default (no tbm)

  - name: KnowledgeGraph
    identifier: null
    populated_when: default (no tbm)

  - name: RelatedQuestion
    identifier: null
    description: A People Also Ask pair.
    populated_when: default (no tbm)

  - name: RelatedSearch
    identifier: null
    populated_when: default (no tbm)

  - name: ImageResult
    identifier: null
    populated_when: tbm=isch

  - name: NewsResult
    identifier: null
    populated_when: tbm=nws

  - name: ShoppingResult
    identifier: null
    populated_when: tbm=shop
    note: >-
      The one result type that yields a follow-on lookup: a shopping result's
      product id feeds GET /api/v1/shopping.

  - name: MapResult
    identifier: null
    populated_when: tbm=lcl or tbm=map

  - name: VideoResult
    identifier: null
    populated_when: tbm=vid, or search_engine=youtube.com

  - name: TrendsResult
    identifier: null
    populated_when: tbm=trends, or the /api/v1/trends endpoint

  - name: Batch
    root: true
    identifier: id
    id_field: id
    description: >-
      The only addressable, persistent resource in the API. Created by POST
      /api/v1/batches, listed by GET /api/v1/batches, fetched by GET
      /api/v1/batches/{id}, and pushed to a webhook_url on completion.
    operations: [submitBatch, listBatches, getBatch]

  - name: BatchJob
    identifier: job_id
    id_field: job_id
    description: >-
      One unit of work inside a batch. `job_id` is assigned by Zenserp and appears
      only in the webhook/poll response, never in the submission. `custom_id` is
      the caller's own label, echoed back in the `request` object.
    embedded_in: [Batch]

  - name: LanguageItem
    identifier: hl code
    description: A supported interface language. Published by GET /api/v2/hl.

  - name: CountryItem
    identifier: gl code
    description: A supported country. Published by GET /api/v2/gl.

  - name: LocationItem
    identifier: canonical location string
    description: >-
      A canonical Google geo-targeting location. Published by GET
      /api/v2/locations, sourced upstream from Google's geotargeting CSVs.

  - name: EngineItem
    identifier: engine domain
    description: A supported search-engine domain. Published by GET /api/v2/search_engines.

  - name: StatusResponse
    identifier: null
    description: '{"remaining_requests": <n>} -- the account quota read.'
    operations: [getStatus]

  - name: ErrorResponse
    identifier: null
    description: '{"error": "<message>"}. See errors/zenserp-problem-types.yml.'

