parameter_relationships:
  - parameter: hl
    enumerated_by: GET /api/v2/hl
    consumed_by: [search, trendsSearch, trendsTrending, shoppingProductPage]
  - parameter: gl
    enumerated_by: GET /api/v2/gl
    consumed_by: [search, shoppingProductPage]
  - parameter: location
    enumerated_by: GET /api/v2/locations
    consumed_by: [search, shoppingProductPage]
    note: >-
      The docs stress that ad-verification accuracy depends on passing a location
      string that Google actually publishes -- so the list endpoint is not
      optional reference material, it is a precondition for correct results.
  - parameter: search_engine
    enumerated_by: GET /api/v2/search_engines
    consumed_by: [search, shoppingProductPage]
    note: >-
      Also the switch for non-Google engines -- bing.com, yandex.com,
      youtube.com are passed here rather than through a separate endpoint.

